<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Blue's Workbench</title>
<script src="./xlsx.full.min.js"></script>
<script>if (typeof XLSX === 'undefined') document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\\/script>');</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#FAF6F1;--surface:#FFFFFF;--surface2:#F5EDE4;
  --border:#E8DDD0;--border2:#D9CBBA;
  --text:#1A1410;--text2:#7A6E62;--text3:#A89A8C;
  --claude:#D4A27F;--claude-dark:#B8845E;--claude-light:#F0DFD0;
  --accent:#25D366;--accent-dark:#1DA855;
  --blue:#5B7FD4;--red:#D45B5B;--purple:#9B7FD4;--orange:#D4955B;
  --radius:12px;
  --shadow:0 1px 3px rgba(26,20,16,.06),0 4px 12px rgba(26,20,16,.04);
  --shadow-lg:0 4px 16px rgba(26,20,16,.08),0 12px 40px rgba(26,20,16,.06);
}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 36px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.header-left{display:flex;align-items:center;gap:14px;}
.header-logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,var(--claude),var(--claude-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:600;}
.header h1{font-family:'Instrument Serif',serif;font-size:22px;font-weight:400;letter-spacing:-.3px;}
.header h1 span{font-style:italic;color:var(--claude-dark);}
.header-actions{display:flex;gap:8px;}
.btn{padding:8px 18px;border-radius:8px;border:1px solid var(--border);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--text);}
.btn:hover{border-color:var(--border2);box-shadow:var(--shadow);}
.btn-primary{background:var(--claude);color:#fff;border-color:var(--claude);}
.btn-primary:hover{background:var(--claude-dark);border-color:var(--claude-dark);}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-accent:hover{background:var(--accent-dark);}
.btn-danger{background:transparent;color:var(--red);border-color:var(--red);}
.export-wrap{position:relative;}
.export-menu{display:none;position:absolute;top:100%;right:0;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);overflow:hidden;z-index:150;min-width:170px;}
.export-wrap.open .export-menu{display:block;}
.export-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:10px 16px;border:none;background:none;font-family:inherit;font-size:13px;color:var(--text);cursor:pointer;text-align:left;}
.export-menu button:hover{background:var(--surface2);}
.export-menu button+button{border-top:1px solid var(--border);}
.stats-bar{display:flex;gap:10px;padding:18px 36px;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto;}
.stat-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 22px;min-width:120px;flex-shrink:0;}
.stat-card .num{font-family:'Instrument Serif',serif;font-size:28px;font-weight:400;line-height:1;}
.stat-card .label{font-size:11px;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:.8px;font-weight:500;}
.stat-card.c1 .num{color:var(--claude-dark);}
.stat-card.c2 .num{color:var(--blue);}
.stat-card.c3 .num{color:var(--orange);}
.stat-card.c4 .num{color:var(--purple);}
.stat-card.c5 .num{color:var(--accent-dark);}
.toolbar{padding:14px 36px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--surface);}
.search-wrap{position:relative;flex:1;min-width:200px;}
.search-wrap::before{content:'⌕';position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text3);}
.search-box{width:100%;padding:9px 14px 9px 36px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;}
.search-box:focus{border-color:var(--claude);}
select.filter-select{padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;outline:none;cursor:pointer;}
.drop-zone{margin:28px 36px;border:2px dashed var(--border2);border-radius:20px;padding:72px 20px;text-align:center;transition:all .3s;cursor:pointer;background:var(--surface);}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--claude);background:var(--claude-light);}
.drop-zone h2{font-family:'Instrument Serif',serif;font-size:20px;font-weight:400;margin-bottom:6px;}
.drop-zone p{color:var(--text2);font-size:13px;}
.drop-zone.hidden{display:none;}
.file-tags{padding:6px 36px;display:flex;gap:8px;flex-wrap:wrap;}
.file-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text2);}
.file-tag .count{background:var(--claude);color:#fff;padding:1px 8px;border-radius:10px;font-weight:600;font-size:11px;}
.file-tag .remove{cursor:pointer;opacity:.4;font-size:14px;}
.file-tag .remove:hover{opacity:1;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;padding:20px 36px 48px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .25s;position:relative;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);}
.card:hover{border-color:var(--claude);box-shadow:var(--shadow-lg);transform:translateY(-2px);}
.card-top{display:flex;gap:14px;align-items:flex-start;}
.avatar-wrap{width:52px;height:52px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;}
.avatar-fallback{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:21px;font-family:'Instrument Serif',serif;color:#fff;font-weight:400;z-index:1;}
.avatar-wrap img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:2;}
.card-info{flex:1;min-width:0;}
.card-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-username{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace;}
.card-score{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;font-family:'JetBrains Mono',monospace;}
.score-high{background:rgba(37,211,102,.1);color:var(--accent-dark);border:2px solid var(--accent);}
.score-mid{background:rgba(212,149,91,.1);color:var(--orange);border:2px solid var(--orange);}
.score-low{background:var(--surface2);color:var(--text3);border:2px solid var(--border);}
.card-badges{display:flex;gap:5px;flex-wrap:wrap;}
.badge{font-size:11px;padding:3px 10px;border-radius:6px;font-weight:500;}
.badge-category{background:rgba(155,127,212,.1);color:var(--purple);}
.badge-city{background:rgba(212,162,127,.12);color:var(--claude-dark);}
.badge-country{background:rgba(91,127,212,.1);color:var(--blue);}
.badge-verified{background:rgba(37,211,102,.1);color:var(--accent-dark);}
.badge-biz{background:rgba(212,149,91,.1);color:var(--orange);}
.card-bio{font-size:12px;color:var(--text2);line-height:1.6;max-height:57px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.card-contact{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;}
.contact-btn{padding:7px 14px;border-radius:20px;border:none;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;text-decoration:none;transition:all .2s;display:inline-flex;align-items:center;gap:5px;}
.wa-btn{background:#25D366;color:#fff;}.wa-btn:hover{background:#1DA855;}
.msg-btn{background:#128C7E;color:#fff;}.msg-btn:hover{background:#075E54;}

/* WhatsApp number display row */
.wa-number-row{display:flex;align-items:center;gap:8px;padding:7px 11px;background:rgba(37,211,102,.06);border:1px solid rgba(37,211,102,.22);border-radius:8px;transition:all .15s;}
.wa-number-row:hover{background:rgba(37,211,102,.1);border-color:rgba(37,211,102,.35);}
.wa-num-icon{color:var(--accent-dark);display:flex;align-items:center;flex-shrink:0;}
.wa-num-text{flex:1;min-width:0;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--accent-dark);font-weight:500;letter-spacing:.3px;cursor:pointer;user-select:all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wa-num-text:hover{text-decoration:underline;}
.wa-copy-btn{background:none;border:none;color:var(--text3);cursor:pointer;padding:4px;display:flex;align-items:center;border-radius:5px;transition:all .15s;flex-shrink:0;}
.wa-copy-btn:hover{color:var(--accent-dark);background:rgba(37,211,102,.15);}
.wa-number-row.copied{background:rgba(37,211,102,.18);border-color:var(--accent);}
.wa-number-row.copied .wa-copy-btn{color:var(--accent-dark);}
/* Compact version inside list view cells */
.list-table .wa-num-inline{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.2);border-radius:12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-dark);font-weight:500;cursor:pointer;letter-spacing:.2px;transition:all .15s;max-width:180px;}
.list-table .wa-num-inline:hover{background:rgba(37,211,102,.15);border-color:var(--accent);}
.list-table .wa-num-inline .num{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:all;}
.list-table .wa-num-inline.copied{background:rgba(37,211,102,.2);border-color:var(--accent);}

.email-btn{background:#4285F4;color:#fff;}.email-btn:hover{background:#3367D6;}
.ig-btn{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);color:#fff;}
.web-btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);}

/* Instagram-style stats footer */
.card-footer{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--border);}
.ig-stats{display:flex;gap:0;flex:1;}
.ig-stat{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;min-width:60px;gap:1px;}
.ig-stat .ig-num{font-size:15px;font-weight:700;color:var(--text);line-height:1.2;}
.ig-stat .ig-label{font-size:10px;color:var(--text3);font-weight:400;}
.status-select{padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:11px;cursor:pointer;outline:none;}

/* Search highlight */
mark.hl{background:rgba(212,162,127,.4);color:inherit;border-radius:2px;padding:0 1px;}

/* View toggle */
.view-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-left:4px;}
.view-toggle button{padding:6px 10px;border:none;background:var(--surface);color:var(--text3);cursor:pointer;font-size:14px;line-height:1;transition:all .15s;}
.view-toggle button:not(:last-child){border-right:1px solid var(--border);}
.view-toggle button.active{background:var(--claude);color:#fff;}
.view-toggle button:hover:not(.active){background:var(--surface2);}

/* List view */
.list-wrap{padding:0 36px 48px;display:none;}
.list-wrap.active{display:block;}
.cards.active{display:grid;}
.cards{display:none;}
.list-table{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.list-table thead{position:sticky;top:0;z-index:2;}
.list-table th{background:var(--surface2);padding:10px 14px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap;}
.list-table td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
.list-table tbody tr{transition:background .15s;}
.list-table tbody tr:hover{background:var(--surface2);}
.list-table tbody tr:last-child td{border-bottom:none;}
.list-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;display:inline-flex;}
.list-avatar .avatar-fallback{width:32px;height:32px;font-size:13px;}
.list-avatar img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:2;}
.list-name-cell{display:flex;align-items:center;gap:10px;min-width:180px;}
.list-name-text{min-width:0;}
.list-name-text .card-name{font-size:13px;}
.list-name-text .card-username{font-size:11px;}
.list-score{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;}
.list-badges{display:flex;gap:4px;flex-wrap:wrap;max-width:200px;}
.list-actions{display:flex;gap:4px;flex-wrap:nowrap;}
.list-actions .contact-btn{padding:4px 8px;font-size:11px;border-radius:14px;}
.list-actions .contact-btn.disabled{opacity:.2;pointer-events:none;filter:grayscale(1);}
td.col-country{white-space:nowrap;font-size:12px;color:var(--blue);font-weight:500;}
td.col-followers{font-family:'JetBrains Mono',monospace;font-size:12px;white-space:nowrap;}
td.col-status .status-select{font-size:11px;}
td.col-category .badge{font-size:10px;padding:2px 7px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;}
.filter-count{font-size:11px;color:var(--text2);font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.filter-count.filtered{color:var(--claude-dark);font-weight:600;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,20,16,.4);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.active{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;max-width:540px;width:92%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal h3{margin-bottom:16px;font-family:'Instrument Serif',serif;font-size:18px;font-weight:400;}
.modal textarea{width:100%;min-height:160px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:13px;padding:14px;resize:vertical;outline:none;line-height:1.7;}
.modal textarea:focus{border-color:var(--claude);}
.modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
.copy-toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--claude-dark);color:#fff;padding:10px 28px;border-radius:12px;font-weight:500;font-size:14px;transition:transform .3s;z-index:300;box-shadow:var(--shadow-lg);}
.copy-toast.show{transform:translateX(-50%) translateY(0);}
.empty-state{text-align:center;padding:80px 20px;color:var(--text2);}
.empty-state h3{font-family:'Instrument Serif',serif;font-size:18px;margin-bottom:8px;color:var(--text);font-weight:400;}
/* Geo panel */
.geo-panel{padding:16px 36px;background:var(--surface);border-bottom:1px solid var(--border);}
.geo-panel.hidden{display:none;}
.geo-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.btn-sm{padding:5px 12px;font-size:11px;font-weight:600;font-family:inherit;border-radius:6px;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--surface2);color:var(--text);}
.btn-sm:hover{border-color:var(--claude);color:var(--claude-dark);}
.geo-info{font-size:11px;color:var(--text2);margin-left:auto;font-family:'JetBrains Mono',monospace;}
.region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
.region-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;transition:all .15s;position:relative;}
.region-card.all-selected{border-color:var(--blue);background:rgba(91,127,212,.04);}
.region-card.partial-selected{border-color:var(--orange);background:rgba(212,149,91,.04);}
.region-header{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.region-check{width:18px;height:18px;border:2px solid var(--border2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;transition:all .15s;flex-shrink:0;}
.region-card.all-selected .region-check{background:var(--blue);border-color:var(--blue);}
.region-card.partial-selected .region-check{background:var(--orange);border-color:var(--orange);}
.region-name{font-weight:600;font-size:14px;flex:1;}
.region-count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--accent-dark);font-weight:600;}
.country-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.country-chip{padding:3px 10px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--surface);color:var(--text2);user-select:none;display:flex;align-items:center;gap:4px;}
.country-chip:hover{border-color:var(--blue);}
.country-chip.selected{background:rgba(91,127,212,.1);color:var(--blue);border-color:var(--blue);font-weight:600;}
.country-chip .chip-count{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.7;}
.geo-active-tag{background:rgba(91,127,212,.1);color:var(--blue);border-color:var(--blue);font-weight:600;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}

/* VCF export panel */
.vcf-panel{padding:16px 36px;background:var(--surface);border-bottom:1px solid var(--border);}
.vcf-panel.hidden{display:none;}
.vcf-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.vcf-info{font-size:11px;color:var(--text2);margin-left:auto;font-family:'JetBrains Mono',monospace;}
.vcf-hint{font-size:11px;color:var(--text3);margin-bottom:10px;}
.vcf-hint code{background:var(--surface2);padding:1px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;color:var(--claude-dark);font-size:10.5px;}
.vcf-region-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;}
.vcf-region-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;transition:all .15s;position:relative;user-select:none;}
.vcf-region-card:hover{border-color:var(--claude);}
.vcf-region-card.selected{border-color:var(--claude);background:var(--claude-light);box-shadow:0 0 0 1px var(--claude);}
.vcf-region-check{position:absolute;top:10px;right:10px;width:16px;height:16px;border:2px solid var(--border2);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;font-weight:700;transition:all .15s;}
.vcf-region-card.selected .vcf-region-check{background:var(--claude);border-color:var(--claude);}
.vcf-region-name{font-weight:600;font-size:13px;margin-bottom:2px;padding-right:22px;}
.vcf-region-count{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-dark);font-weight:600;}
.vcf-region-countries{font-size:10.5px;color:var(--text2);margin-top:4px;line-height:1.35;max-height:42px;overflow:hidden;}
.vcf-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.vcf-btn{padding:10px 18px;border-radius:8px;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;}
.vcf-btn-main{background:var(--accent);color:#fff;}
.vcf-btn-main:hover:not(:disabled){background:var(--accent-dark);}
.vcf-btn-main:disabled{background:var(--border);color:var(--text3);cursor:not-allowed;}
.vcf-btn-alt{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.vcf-btn-alt:hover:not(:disabled){border-color:var(--claude);color:var(--claude-dark);}
.vcf-btn-alt:disabled{opacity:.4;cursor:not-allowed;}
.vcf-format-preview{background:var(--surface2);border-radius:6px;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--claude-dark);margin-top:10px;border-left:3px solid var(--claude);}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:20px 36px;flex-wrap:wrap;}
.pagination button{padding:6px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-family:inherit;font-size:12px;cursor:pointer;transition:all .15s;}
.pagination button:hover:not(:disabled){border-color:var(--claude);color:var(--claude-dark);}
.pagination button.active{background:var(--claude);color:#fff;border-color:var(--claude);}
.pagination button:disabled{opacity:.3;cursor:not-allowed;}
.pagination .page-info{font-size:11px;color:var(--text2);font-family:'JetBrains Mono',monospace;}

function detectCountry(phoneCode,phone){if(phoneCode){const c=String(phoneCode).replace(/\D/g,'');if(c&&CC[c])return CC[c];for(let l=3;l>=1;l--){const x=c.slice(0,l);if(CC[x])return CC[x]}}if(phone){let p=String(phone).replace(/[\s\-\(\)]/g,'');if(p[0]==='+')p=p.slice(1);else if(p.startsWith('00'))p=p.slice(2);for(let l=3;l>=1;l--){const x=p.slice(0,l);if(CC[x])return CC[x]}}return'';}

function acol(name){let h=0;for(let i=0;i<name.length;i++)h=name.charCodeAt(i)+((h<<5)-h);return COLORS[Math.abs(h)%COLORS.length];}

function highlight(text,q){
  if(!q)return esc(text);
  const safe=esc(text);
  const qe=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return safe.replace(new RegExp('('+qe+')','gi'),'<mark class="hl">$1</mark>');
}


function score(c){let s=0;if(c.email)s+=20;if(c.phone||c.whatsapp)s+=25;if(c.isBiz)s+=15;if(c.website)s+=5;if(c.followers>1e4)s+=15;else if(c.followers>1e3)s+=10;else if(c.followers>100)s+=5;if(c.posts>50)s+=5;if(c.city)s+=5;if(c.bio&&c.bio.length>20)s+=5;if(c.verified)s+=5;return Math.min(s,100);}
function waNum(c){
  if(c.whatsapp){
    let w=String(c.whatsapp).replace(/\D/g,'');
    if(w.startsWith('00'))w=w.slice(2);
    return w||null;
  }
  if(c.phone){
    const cc=String(c.phoneCode||'').replace(/\D/g,'');
    let p=String(c.phone).replace(/\D/g,'');
    if(!p)return null;
    if(p.startsWith('00'))p=p.slice(2);
    // Phone already includes country code → don't duplicate
    if(cc&&p.startsWith(cc)&&p.length>=10)return p;
    if(cc)return cc+p;
    if(p.length>=7)return p;
  }
  return null;
}
function formatWaNum(raw){
  if(!raw)return'';

  const len=rest.length;
  let formatted;
  if(len<=4)formatted=rest;
  else if(len<=7)formatted=rest.slice(0,len-4)+' '+rest.slice(len-4);
  else if(len<=10)formatted=rest.slice(0,len-7)+' '+rest.slice(len-7,len-4)+' '+rest.slice(len-4);
  else formatted=rest.slice(0,3)+' '+rest.slice(3,len-4)+' '+rest.slice(len-4);
  return cc?'+'+cc+(formatted?' '+formatted:''):'+'+formatted;
}
function copyWaNum(ev,text,rowEl){
  ev&&ev.stopPropagation();
  navigator.clipboard.writeText(text).then(()=>{
    const t=document.getElementById('toast');t.textContent='✅ 已复制 '+text;t.classList.add('show');
    setTimeout(()=>{t.classList.remove('show');t.textContent='✅ 已复制';},1400);
    if(rowEl){rowEl.classList.add('copied');setTimeout(()=>rowEl.classList.remove('copied'),1000);}
  }).catch(()=>{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();});
}

function norm(r,src){const c={id:r['User ID']||r['user_id']||Math.random().toString(36).slice(2),username:r['Username']||r['username']||'',fullname:r['Fullname']||r['fullname']||r['Full Name']||'',posts:parseInt(r['Posts']||r['posts'])||0,followers:parseInt(r['Followers']||r['followers'])||0,email:r['Email']||r['email']||'',phoneCode:r['Phone Country Code']||r['phone_country_code']||'',phone:r['Phone']||r['phone']||'',city:r['City']||r['city']||'',verified:(r['Is verified']||'').toString().toUpperCase()==='YES',isBiz:(r['Is Business']||'').toString().toUpperCase()==='YES',website:r['External URL']||r['external_url']||'',profileUrl:r['Profile URL']||r['profile_url']||'',avatarUrl:r['Avatar URL']||r['avatar_url']||'',bio:r['Biography']||r['biography']||'',category:r['Category']||r['category']||'',whatsapp:r['whatsapp_number']||r['whatsapp']||'',src,status:'未联系'};c.role=c.category||'未分类';c.country=detectCountry(c.phoneCode,c.phone||c.whatsapp);c.region=getRegion(c.country);c.score=score(c);return c;}

async function load(files){for(const f of files){try{const buf=await f.arrayBuffer();const wb=XLSX.read(buf,{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});const ids=new Set(D.map(c=>c.id));let n=0;rows.forEach(r=>{const c=norm(r,f.name);if(!ids.has(c.id)){D.push(c);ids.add(c.id);n++;if(c.country)selCountries.add(c.country);}});FM[f.name]=(FM[f.name]||0)+n;}catch(e){alert('解析失败: '+f.name);}}geoInited=true;saveLS();render();}

function cards(resetPage){
  if(resetPage!==false)curPage=0;
  const q=document.getElementById('searchBox').value.toLowerCase();
  const fs=document.getElementById('fStatus').value;
  const fr=document.getElementById('fRole').value;
  const fc=document.getElementById('fContact').value;
  const so=document.getElementById('fSort').value;
  // Country filter
  const allCountriesInData=new Set(D.map(c=>c.country).filter(Boolean));
  const hasNoCountry=D.some(c=>!c.country);
  const geoActive=(selCountries.size<allCountriesInData.size)||(hasNoCountry&&!selNoCountry);
  let f=D.filter(c=>{
    if(q&&![c.fullname,c.username,c.bio,c.city,c.email,c.category,c.country||'',c.region||''].join(' ').toLowerCase().includes(q))return false;
    if(fs&&c.status!==fs)return false;if(fr&&c.role!==fr)return false;
    if(geoActive){
      if(!c.country&&!selNoCountry)return false;
      if(c.country&&!selCountries.has(c.country))return false;
    }
    if(fc==='wa'&&!waNum(c))return false;if(fc==='em'&&!c.email)return false;
    if(fc==='ph'&&!c.phone&&!c.whatsapp)return false;if(fc==='web'&&!c.website)return false;
    return true;
  });
  f.sort((a,b)=>so==='score'?b.score-a.score:so==='followers'?b.followers-a.followers:so==='posts'?b.posts-a.posts:(a.fullname||a.username).localeCompare(b.fullname||b.username));

  });
  }

  lb.innerHTML='';

function renderGeoPanel(){
  const countryCount={};let noCountryCount=0;
  D.forEach(c=>{if(c.country)countryCount[c.country]=(countryCount[c.country]||0)+1;else noCountryCount++;});
  const allCountries=Object.keys(countryCount);
  if(!geoInited&&allCountries.length){selCountries=new Set(allCountries);selNoCountry=true;geoInited=true;}

  const regionData={};
  allCountries.forEach(country=>{
    const region=getRegion(country);
    if(!regionData[region])regionData[region]={countries:[],total:0};
    regionData[region].countries.push(country);
    regionData[region].total+=countryCount[country];
  });

  const grid=document.getElementById('regionGrid');
  grid.innerHTML='';
  Object.entries(regionData).sort((a,b)=>b[1].total-a[1].total).forEach(([region,data])=>{
    data.countries.sort((a,b)=>(countryCount[b]||0)-(countryCount[a]||0));
    const allSel=data.countries.every(c=>selCountries.has(c));
    const someSel=data.countries.some(c=>selCountries.has(c));
    const card=document.createElement('div');
    card.className='region-card'+(allSel?' all-selected':someSel?' partial-selected':'');
    card.innerHTML=`
      <div class="region-header" data-region="${region}">
        <div class="region-check">${allSel?'✓':someSel?'—':''}</div>
        <div class="region-name">${region}</div>
        <div class="region-count">${data.total} 人</div>
      </div>
      <div class="country-chips">
        ${data.countries.map(c=>`<div class="country-chip${selCountries.has(c)?' selected':''}" data-country="${c}">${c} <span class="chip-count">${countryCount[c]}</span></div>`).join('')}
      </div>`;
    card.querySelector('.region-header').addEventListener('click',()=>{
      const shouldSelect=!data.countries.every(c=>selCountries.has(c));
      data.countries.forEach(c=>{if(shouldSelect)selCountries.add(c);else selCountries.delete(c);});
      renderGeoPanel();cards();
    });
    card.querySelectorAll('.country-chip').forEach(chip=>{
      chip.addEventListener('click',e=>{
        e.stopPropagation();
        const country=chip.dataset.country;
        if(selCountries.has(country))selCountries.delete(country);else selCountries.add(country);
        renderGeoPanel();cards();
      });
    });
    grid.appendChild(card);
  });

  // "未识别" group for contacts without country
  if(noCountryCount>0){
    const card=document.createElement('div');
    card.className='region-card'+(selNoCountry?' all-selected':'');
    card.innerHTML=`
      <div class="region-header">
        <div class="region-check">${selNoCountry?'✓':''}</div>
        <div class="region-name" style="color:var(--text3)">未识别</div>
        <div class="region-count">${noCountryCount} 人</div>
      </div>
      <div class="country-chips"><div class="country-chip${selNoCountry?' selected':''}" style="color:var(--text3)">无电话/国家 <span class="chip-count">${noCountryCount}</span></div></div>`;
    card.addEventListener('click',()=>{selNoCountry=!selNoCountry;renderGeoPanel();cards();});
    grid.appendChild(card);
  }
  updateGeoInfo();
}

function updateGeoInfo(){
  const allCountriesInData=new Set(D.map(c=>c.country).filter(Boolean));
  const selCount=D.filter(c=>c.country&&selCountries.has(c.country)).length;
  document.getElementById('geoInfo').textContent=`已选 ${selCountries.size}/${allCountriesInData.size} 个国家，${selCount} 人`;
  // Update toggle button appearance
  const btn=document.getElementById('btnToggleGeo');
  if(selCountries.size<allCountriesInData.size&&selCountries.size>0){
    btn.textContent=`🌍 国家筛选 (${selCountries.size})`;
    btn.classList.add('geo-active-tag');
  }else{
    btn.textContent='🌍 国家筛选';
  }
}

function geoAll(){
  D.forEach(c=>{if(c.country)selCountries.add(c.country);});
  selNoCountry=true;
  renderGeoPanel();cards();
}
function geoNone(){
  selCountries.clear();selNoCountry=false;
  renderGeoPanel();cards();

function geoInvert(){
  const allC=new Set(D.map(c=>c.country).filter(Boolean));
  const nw=new Set([...allC].filter(c=>!selCountries.has(c)));
  selCountries=nw;selNoCountry=!selNoCountry;
  renderGeoPanel();cards();
}

let vcfSel=new Set(),vcfCountries={},vcfInited=false;

function escV(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n').replace(/\r/g,'');}

// 导出当天日期，格式 YYMMDD（年月日），如 260703
function vcfDateStr(){
  const d=new Date();
  return String(d.getFullYear()%100).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
}

function buildVcfContacts(){
  // Only contacts with phone/whatsapp; name = 日期 国家 名字
  const dt=vcfDateStr();
  const list=[];
  D.forEach(c=>{
    const w=waNum(c);
    if(!w)return;
    const country=c.country||'';
    const company=(c.fullname||c.username||'').trim();
    const contactName=dt+' '+(country?country+' ':'')+(company||'Unknown');
    list.push({_phone:'+'+w,_country:country,_company:company,_contactName:contactName,_ckey:country||'未识别'});
  });
  return list;
}

function genVcf(contacts){
  let v='';
  contacts.forEach(c=>{
    const nm=escV(c._contactName),co=escV(c._country),cp=escV(c._company);
    v+='BEGIN:VCARD\r\nVERSION:3.0\r\n';
    v+='N:'+nm+';;;;\r\n';
    v+='FN:'+nm+'\r\n';
    v+='TEL;TYPE=CELL:'+c._phone+'\r\n';
    if(cp&&co)v+='ORG:'+co+' '+cp+'\r\n';
    else if(cp)v+='ORG:'+cp+'\r\n';
    else if(co)v+='ORG:'+co+'\r\n';
    if(co)v+='NOTE:'+co+'\r\n';
    v+='END:VCARD\r\n';
  });
  return v;
}

function dlVcf(content,filename){
  const blob=new Blob([content],{type:'text/vcard;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
}

function renderVcfPanel(){
  const contacts=buildVcfContacts();
  vcfCountries={};
  contacts.forEach(c=>{if(!vcfCountries[c._ckey])vcfCountries[c._ckey]=[];vcfCountries[c._ckey].push(c);});
  const keys=Object.keys(vcfCountries);
  if(!vcfInited&&keys.length){vcfSel=new Set(keys);vcfInited=true;}
  // Drop selections for countries that no longer exist
  [...vcfSel].forEach(k=>{if(!vcfCountries[k])vcfSel.delete(k);});

  const grid=document.getElementById('vcfRegionGrid');
  grid.innerHTML='';
  if(!contacts.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:28px;color:var(--text3);font-size:13px">暂无可导出的联系人（需要有 WhatsApp 或电话号码）</div>';
    document.getElementById('vcfFormatPreview').textContent='—';
    document.getElementById('btnVcfAll').disabled=true;
    document.getElementById('btnVcfSelected').disabled=true;
    document.getElementById('btnVcfSelected').textContent='下载选中国家';
    document.getElementById('vcfInfo').textContent='';
    return;
  }
  // Format preview based on first contact
  document.getElementById('vcfFormatPreview').textContent='预览：'+contacts[0]._contactName+'  —  '+contacts[0]._phone;

  Object.entries(vcfCountries).sort((a,b)=>b[1].length-a[1].length).forEach(([country,items])=>{
    const card=document.createElement('div');
    const isSel=vcfSel.has(country);
    const region=country!=='未识别'?(getRegion(country)||'其他'):'—';
    card.className='vcf-region-card'+(isSel?' selected':'');
    card.dataset.country=country;
    card.innerHTML='<div class="vcf-region-check">'+(isSel?'✓':'')+'</div>'+
      '<div class="vcf-region-name">'+esc(country)+'</div>'+
      '<div class="vcf-region-count">'+items.length+' 人</div>'+
      '<div class="vcf-region-countries">'+esc(region)+'</div>';
    card.addEventListener('click',()=>{
      if(vcfSel.has(country))vcfSel.delete(country);else vcfSel.add(country);
      renderVcfPanel();
    });
    grid.appendChild(card);
  });
  updateVcfInfo();
}

function updateVcfInfo(){
  const total=Object.values(vcfCountries).reduce((s,a)=>s+a.length,0);
  let n=0;vcfSel.forEach(k=>{if(vcfCountries[k])n+=vcfCountries[k].length;});
  document.getElementById('vcfInfo').textContent='已选 '+vcfSel.size+'/'+Object.keys(vcfCountries).length+' 个国家，'+n+' 人 / 共 '+total+' 人';
  const btnSel=document.getElementById('btnVcfSelected'),btnAll=document.getElementById('btnVcfAll');
  btnSel.disabled=!n;
  btnSel.textContent=n?('下载选中 '+vcfSel.size+' 个国家（'+n+' 人）'):'请选择国家';
  btnAll.disabled=!total;
  btnAll.textContent='全部下载（'+total+' 人）';
  // Toolbar button indicator
  const btn=document.getElementById('btnToggleVcf');
  btn.textContent=total?('📇 VCF 导出 ('+total+')'):'📇 VCF 导出';
}

function vcfAll(){vcfSel=new Set(Object.keys(vcfCountries));renderVcfPanel();}
function vcfNone(){vcfSel.clear();renderVcfPanel();}
function vcfInvert(){const nw=new Set(Object.keys(vcfCountries).filter(k=>!vcfSel.has(k)));vcfSel=nw;renderVcfPanel();}

function downloadVcfAll(){
  const contacts=buildVcfContacts();
  if(!contacts.length)return;
  dlVcf(genVcf(contacts),vcfDateStr()+'_全部_'+contacts.length+'人.vcf');
}

function downloadVcfSelected(){
  if(!vcfSel.size)return;
  let list=[];vcfSel.forEach(k=>{if(vcfCountries[k])list.push(...vcfCountries[k]);});
  if(!list.length)return;
  const ks=[...vcfSel];
  const label=ks.length<=3?ks.join('+'):ks.length+'个国家';
  dlVcf(genVcf(list),vcfDateStr()+'_'+label+'_'+list.length+'人.vcf');
}

function toggleVcfPanel(){
  const p=document.getElementById('vcfPanel');
  p.classList.toggle('hidden');
  const btn=document.getElementById('btnToggleVcf');
  btn.classList.toggle('geo-active-tag',!p.classList.contains('hidden'));
  if(!p.classList.contains('hidden'))renderVcfPanel();
}


loadLS();
